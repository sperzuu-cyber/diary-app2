{% extends "base.html" %}

{% block content %}
<section class="form-page">
    <div class="form-card">
        <p class="eyebrow">Brain dump</p>
        <h1>Unload your mind...</h1>
        <p class="subtitle">
            Thoughts, memories, feelings, progress - whatever today felt like.
        </p>

        <form method="POST">
            <label>No-contact status</label>
            <select name="mood">
                <option value="continued_no_contact">Continued no contact</option>
                <option value="broke_no_contact">I broke no contact</option>
            </select>

            <label>Brain dump</label>
            <textarea 
                name="content" 
                rows="10" 
                placeholder="Write whatever you needed to say today..."
                required></textarea>

            <div class="privacy-box">
                <label class="checkbox-label">
                    <input type="checkbox" name="is_public">
                    Make this visible in the public vault
                </label>
                <p>Leave unticked if this should stay private.</p>
            </div>

            <button type="submit" class="button full">Save check-in</button>
        </form>
    </div>
</section>
{% endblock %}
