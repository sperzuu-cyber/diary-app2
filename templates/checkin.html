{% extends "base.html" %}

{% block content %}
<section class="form-page">
    <div class="form-card">
        <p class="eyebrow">General emotional check-in</p>
        <h1>Where are you today?</h1>
        <p class="subtitle">
            Be honest with yourself. Did you continue no contact, or did you break it?
        </p>

        <form method="POST">
            <label>No-contact status</label>
            <select name="mood">
                <option value="continued_no_contact">Continued no contact</option>
                <option value="broke_no_contact">I broke no contact</option>
            </select>

            <label>General emotional check-in</label>
            <textarea 
                name="content" 
                rows="10" 
                placeholder="Write what happened, what triggered you, what you felt, what you nearly did, or what you need to remember today..."
                required></textarea>

            <div class="privacy-box">
                <label class="checkbox-label">
                    <input type="checkbox" name="is_public">
                    Make this visible in the public vault
                </label>
                <p>Leave unticked if this should stay private.</p>
            </div>

            <button type="submit" class="button full">Save check-in</button>
        </form>
    </div>
</section>
{% endblock %}
